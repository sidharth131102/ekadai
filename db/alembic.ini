[alembic]
script_location = db/alembic
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is deliberately omitted here — env.py sets it from db.config.DATABASE_URL
# (which reads .env) so the same migration set targets local Docker Postgres or Supabase
# depending only on environment, never on a hardcoded value committed to the repo.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
