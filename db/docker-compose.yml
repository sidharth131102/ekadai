services:
  postgres:
    image: postgres:16
    container_name: ekadai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ekadai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekadai}
      POSTGRES_DB: ${POSTGRES_DB:-ekadai}
    # Phase 5 — logical replication for Debezium CDC (§44). Requires a restart to take
    # effect; the pgdata volume is untouched, so existing data survives.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ekadai} -d ${POSTGRES_DB:-ekadai}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
