services:
  connect:
    build:
      context: .
      dockerfile: Dockerfile
    image: ekadai-debezium-connect
    container_name: ekadai-debezium-connect
    restart: unless-stopped
    environment:
      # Reaches Kafka/Schema Registry/Postgres via the host, avoiding coupling this compose
      # project's network to kafka/'s or db/'s. Kafka's PLAINTEXT_DOCKER listener (29093,
      # advertised as host.docker.internal) exists specifically for this — the PLAINTEXT_HOST
      # listener (29092, advertised as "localhost") only resolves correctly for a process
      # actually on the host, not from inside another container.
      BOOTSTRAP_SERVERS: host.docker.internal:29093
      GROUP_ID: ekadai-connect-cluster
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://host.docker.internal:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://host.docker.internal:8081
      CONNECT_REST_ADVERTISED_HOST_NAME: localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
